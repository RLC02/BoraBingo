name: CI/CD Pipeline - Build, Docker & Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_render:
        description: 'Deploy to Render after Docker Hub push?'
        required: true
        type: boolean
        default: true

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || 'rlc02' }}
  DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  SERVICE_NAME: auth-service
  IMAGE_NAME: bingo-auth-service

jobs:
  # =========================================================================
  # 1. BUILD & TEST
  # =========================================================================
  build-and-test:
    name: Build & Test Java Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Auth Service with Maven
        run: |
          echo "Compilando e empacotando apenas o auth-service..."
          mvn -B clean package -pl auth-service -am -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: auth-service/target/*.jar
          retention-days: 1

  # =========================================================================
  # 2. BUILD & PUSH DOCKER IMAGE
  # =========================================================================
  build-and-push-docker:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.jvm
          build-args: |
            SERVICE=${{ env.SERVICE_NAME }}
          platforms: linux/amd64
          push: ${{ env.DOCKER_PASSWORD != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. DEPLOY TO RENDER
  # =========================================================================
  deploy-to-render:
    name: Trigger Render Deployment
    needs: build-and-push-docker
    if: github.event_name == 'push' || github.event.inputs.deploy_to_render == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ env.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_AUTH || secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "=========================================================="
          echo " Acionando Deploy no Render com Resiliência"
          echo "=========================================================="

          # 1. Se houver Deploy Hook URL
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Disparando Deploy Hook..."
            attempt=1
            max_attempts=3
            while [ $attempt -le $max_attempts ]; do
              echo "Tentativa $attempt de $max_attempts..."
              status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK" || true)
              if [ "$status" = "200" ] || [ "$status" = "201" ] || [ "$status" = "202" ]; then
                echo "Deploy iniciado com sucesso no Render (HTTP $status)"
                break
              else
                echo "Aviso: Tentativa falhou com status $status. Aguardando 5s..."
                sleep 5
                attempt=$((attempt + 1))
              fi
            done
          fi

          # 2. Se houver RENDER_API_KEY
          if [ -n "$RENDER_API_KEY" ]; then
            echo "Consultando Render REST API..."
            services_json=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=10" || true)
            service_id=$(echo "$services_json" | grep -o '"id":"srv-[^"]*"' | head -n 1 | cut -d'"' -f4 || true)
            
            if [ -n "$service_id" ]; then
              echo "Disparando deploy para servico Render $service_id..."
              curl -s -X POST \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H "Content-Type: application/json" \
                -d '{"clearCache": "clear"}' \
                "https://api.render.com/v1/services/$service_id/deploys"
            fi
          fi

          echo "Processo de deploy finalizado."
