server:
  port: ${PORT:8082}

spring:
  application:
    name: bingo-sala-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bingo_db?replicaSet=rs0&directConnection=true}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

bingo:
  rabbitmq:
    exchange: bingo.exchange
    queue:
      sala-eventos: bingo.sala.eventos.queue
      sorteio-eventos: bingo.sorteio.eventos.queue
    routingkey:
      sala-criada: bingo.sala.criada
      sala-iniciada: bingo.sala.iniciada
      numero-sorteado: bingo.numero.sorteado
      bingo-finalizado: bingo.finalizado
