server:
  port: ${PORT:8083}

spring:
  application:
    name: cartela-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bingo_db?replicaSet=rs0&directConnection=true}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

bingo:
  rabbitmq:
    exchange: bingo.exchange
    queue:
      compra-cartela: bingo.compra.cartela.queue
      compra-dlq: bingo.compra.cartela.dlq
    routingkey:
      compra-solicitada: bingo.cartela.compra.solicitada
      compra-confirmada: bingo.cartela.compra.confirmada
      compra-rejeitada: bingo.cartela.compra.rejeitada

services:
  sala-url: ${SERVICES_SALA_URL:http://localhost:8082/api/salas}
  auth-url: ${SERVICES_AUTH_URL:http://localhost:8081/api/auth}
