# Render Blueprint - Bingo Auth Service
# Documentation: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: bingo-auth-service
    runtime: image
    image:
      url: docker.io/rlc02/bingo-auth-service:latest
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
